name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [v4]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz site
        run: npx quartz build

      - name: Deploy to marchelo2212.github.io
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAGES_TOKEN }}
          external_repository: marchelo2212/marchelo2212.github.io
          publish_branch: main
          publish_dir: ./public
          user_name: "marchelo2212"
          user_email: "marchelo2212@gmail.com"
